name: generate animation

on:
  # roda sozinho uma vez por dia
  schedule:
    - cron: "0 */24 * * *"

  # permite rodar na mão pela aba Actions
  workflow_dispatch:

  # roda a cada push na main (a branch do perfil)
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # gera a cobrinha a partir do gráfico de contribuições, nas cores do perfil:
      # musgo no tema claro e limão no tema escuro
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0E3B23
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#D9F26B

      # publica os SVGs na branch output, que o README lê pelo raw.githubusercontent.com
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
